# Reusable: Semgrep SAST (custom rules + community rulesets).
# Ported from fil-one security.yaml (job: semgrep), generalized.
# The custom-config step is skipped automatically when the repo has no such file.
name: Semgrep SAST (reusable)

on:
  workflow_call:
    inputs:
      custom-config:
        description: Path to the repo's custom Semgrep rules (skipped if absent).
        type: string
        required: false
        default: .semgrep.yml
      blocking:
        description: Fail the job on custom-rule findings (community rules are always advisory).
        type: boolean
        required: false
        default: false

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.93.0@sha256:f35c7891e2030110a84a721fdd556ce8f3da6e7e69d7fab1d3660ae1bb334474
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run Semgrep (custom rules)
        id: custom-scan
        if: hashFiles(inputs.custom-config) != ''
        run: |
          semgrep scan \
            --config "${{ inputs.custom-config }}" \
            --sarif --output semgrep-custom.sarif \
            --verbose
        continue-on-error: true

      - name: Evaluate custom-rule outcome
        if: always()
        uses: filecoin-project/ff-sec-actions/actions/scanner-outcome@0548d1ad3feef0a984d652abc86d4a59f1982c72
        with:
          scanner-name: semgrep-custom
          scanner-outcome: ${{ steps.custom-scan.outcome }}
          result-file: semgrep-custom.sarif
          blocking: ${{ inputs.blocking }}

      - name: Upload custom-rule results
        if: always() && hashFiles('semgrep-custom.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semgrep-custom-results
          path: semgrep-custom.sarif

      - name: Upload custom SARIF to GitHub Security tab
        if: always() && vars.ENABLE_GHAS == 'true' && hashFiles('semgrep-custom.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: semgrep-custom.sarif
          category: semgrep-custom
