# Reusable: manifest and lockfile license evidence (Trivy license scanner).
# This baseline never installs Consumer Project dependencies.
name: License Compliance (reusable)

on:
  workflow_call:
    inputs:
      severity:
        description: License severities to report.
        type: string
        required: false
        default: CRITICAL,HIGH
      skip-dirs:
        description: Comma-separated dirs Trivy should skip.
        type: string
        required: false
        default: ""

jobs:
  licenses:
    name: License Compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # trivy-action internally uses actions/cache@v4 (Node 20). Monitor:
      # https://github.com/aquasecurity/trivy-action/releases
      - name: Trivy license scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          scanners: license
          severity: ${{ inputs.severity }}
          skip-dirs: ${{ inputs.skip-dirs }}
        continue-on-error: true # Advisory — review output before blocking
