      contents: read
    uses: filecoin-project/ff-sec-actions/.github/workflows/sec-iac.yml@35cf1a2133cbff03d9cc3039b532f0f4737af9ae

  secrets:
    permissions:
      contents: read
    uses: filecoin-project/ff-sec-actions/.github/workflows/sec-secrets.yml@35cf1a2133cbff03d9cc3039b532f0f4737af9ae

  static-analysis:
