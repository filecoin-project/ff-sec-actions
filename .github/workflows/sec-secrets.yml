# Reusable: Gitleaks secret scanning over full git history.
# Ported from fil-one security.yaml (job: secrets). Blocking by design —
# tune the calling repo's .gitleaks.toml rather than making this advisory.
name: Gitleaks Secret Scan (reusable)

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to the repo's .gitleaks.toml (gitleaks defaults are used if absent).
        type: string
        required: false
        default: .gitleaks.toml
    secrets:
      gitleaks-license:
        description: Gitleaks license key (required for org-owned repos).
        required: false

jobs:
  secrets:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # Full history for git log scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.gitleaks-license }}
          # Empty string when the file is absent -> the action falls back to defaults.
          GITLEAKS_CONFIG: ${{ hashFiles(inputs.config-path) != '' && inputs.config-path || '' }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'
        # Blocking — custom rules should be high-confidence
