# Secretless, non-executing Filecoin ecosystem baseline.
# Copy to .github/workflows/security-baseline.yml in a Consumer Project.
# Advance the full commit only after reviewing the release diff.
name: Ecosystem Security Baseline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    permissions:
      actions: read
      contents: read
    uses: filecoin-project/ff-sec-actions/.github/workflows/ecosystem-baseline.yml@35cf1a2133cbff03d9cc3039b532f0f4737af9ae
    with:
      require-complete: true
      # Start finding gates advisory; enable after reviewing initial results.
      dependency-blocking: false
      iac-blocking: false
      static-analysis-blocking: false
      skip-dirs: node_modules,vendor,target,dist
