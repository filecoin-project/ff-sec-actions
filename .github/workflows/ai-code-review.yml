# Reusable workflow: AI code review.
# Consumers must call this workflow at a reviewed full release commit SHA.
# NOTE: the `uses:` ref on the action step below must be kept in sync with release tags
# (reusable workflows cannot reference sibling actions by relative path without a checkout).
name: AI Code Review (reusable)

on:
  workflow_call:
    inputs:
      model:
        type: string
        required: false
        default: claude-opus-4-8
      domain:
        type: string
        required: false
        default: filecoin
      effort:
        type: string
        required: false
        default: high
      max-tokens:
        type: string
        required: false
        default: "16000"
      max-diff-bytes:
        type: string
        required: false
        default: "400000"
      exclude-pattern:
        type: string
        required: false
        default: ""
      fail-on-severity:
        type: string
        required: false
        default: none
      post-comment:
        type: string
        required: false
        default: "true"
    secrets:
      anthropic-api-key:
        description: Optional at dispatch time; a missing key emits a skipped result.
        required: false
    outputs:
      findings-count:
        value: ${{ jobs.review.outputs.findings-count }}
      highest-severity:
        value: ${{ jobs.review.outputs.highest-severity }}
      completion-status:
        value: ${{ jobs.review.outputs.completion-status }}
      evaluation-result:
        value: ${{ jobs.review.outputs.evaluation-result }}

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      findings-count: ${{ steps.ai-review.outputs.findings-count }}
      highest-severity: ${{ steps.ai-review.outputs.highest-severity }}
      completion-status: ${{ steps.ai-review.outputs.completion-status }}
      evaluation-result: ${{ steps.ai-review.outputs.evaluation-result }}
    steps:
      # No checkout: the action works from the PR diff via the GitHub API and
      # never executes PR code.
      - name: AI code review
        id: ai-review
        uses: filecoin-project/ff-sec-actions/actions/ai-code-review@0548d1ad3feef0a984d652abc86d4a59f1982c72
        with:
          anthropic-api-key: ${{ secrets.anthropic-api-key }}
          model: ${{ inputs.model }}
          domain: ${{ inputs.domain }}
          effort: ${{ inputs.effort }}
          max-tokens: ${{ inputs.max-tokens }}
          max-diff-bytes: ${{ inputs.max-diff-bytes }}
          exclude-pattern: ${{ inputs.exclude-pattern }}
          fail-on-severity: ${{ inputs.fail-on-severity }}
          post-comment: ${{ inputs.post-comment }}
