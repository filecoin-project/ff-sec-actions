# Reusable: static security analysis for consumer GitHub Actions definitions.
# Zizmor runs offline with no repository secrets and never executes project code.
name: GitHub Actions Security (reusable)

on:
  workflow_call:
    inputs:
      config-path:
        description: Explicit zizmor configuration path; empty disables repository config discovery.
        type: string
        required: false
        default: ""
      blocking:
        description: Fail the evaluation when Zizmor produces findings.
        type: boolean
        required: false
        default: false

jobs:
  actions-security:
    name: GitHub Actions Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Analyze workflow security with zizmor
        id: scan
        uses: filecoin-project/ff-sec-actions/actions/zizmor-scan@a6c0e17e90c5d2baef63b32e490c1f080ab97add
        with:
          config-path: ${{ inputs.config-path }}
          result-file: ${{ runner.temp }}/zizmor-actions.sarif

      - name: Normalize GitHub Actions security result
        if: always()
        uses: filecoin-project/ff-sec-actions/actions/evaluation-adapter@5565507389b1444bfdb6b36d366d17206faf3dc3
        with:
          evaluation-id: zizmor-actions
          tool-name: zizmor
          tool-version: 1.28.0
          tool-outcome: ${{ steps.scan.outputs.scanner-outcome || 'failure' }}
          raw-evidence: ${{ steps.scan.outputs.result-file }}
          evidence-artifact: zizmor-actions-results
          remediation-guidance: >-
            Pin third-party actions to reviewed full commit SHAs, minimize token permissions,
            avoid pull_request_target with untrusted checkout, and follow the linked Zizmor rule guidance.
          blocking: ${{ inputs.blocking }}
          coverage-included: '["GitHub Actions workflows and action metadata"]'
          coverage-excluded: '["online repository audits"]'
          coverage-limitations: '["offline mode does not resolve remote action metadata"]'

      - name: Upload normalized GitHub Actions Evaluation Result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evaluation-result-zizmor-actions
          path: ${{ runner.temp }}/zizmor-actions-evaluation-result.json
          if-no-files-found: error

      - name: Upload Zizmor results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zizmor-actions-results
          path: ${{ steps.scan.outputs.result-file }}
          if-no-files-found: warn
