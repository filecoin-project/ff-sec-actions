# Reusable: secretless lockfile and manifest vulnerability scanning with Trivy.
# This baseline never invokes a Consumer Project package manager or build tool.
name: Dependency Scan (reusable)

on:
  workflow_call:
    inputs:
      severity:
        description: Trivy severities to report.
        type: string
        required: false
        default: CRITICAL,HIGH,MEDIUM
      blocking:
        description: Fail the evaluation when findings match the configured severity.
        type: boolean
        required: false
        default: false
      skip-dirs:
        description: Comma-separated dirs Trivy should skip.
        type: string
        required: false
        default: node_modules
      trivyignore-file:
        description: Path to a .trivyignore (used only if present).
        type: string
        required: false
        default: .trivyignore

jobs:
  dependencies:
    name: Dependency Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Trivy vulnerability scan (fs mode)
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-deps.sarif
          severity: ${{ inputs.severity }}
          limit-severities-for-sarif: true
          exit-code: "0"
          cache: "false"
          trivyignores: ${{ hashFiles(inputs.trivyignore-file) != '' && inputs.trivyignore-file || '' }}
          skip-dirs: ${{ inputs.skip-dirs }}
        continue-on-error: true

      - name: Evaluate dependency scan outcome
        id: evaluate
        if: always()
        uses: filecoin-project/ff-sec-actions/actions/evaluation-adapter@f41c68a67bd2bd3fcfd962086c16d5cc68b3cb47
        with:
          evaluation-id: trivy-dependencies
          tool-name: trivy
          tool-version: 0.70.0
          tool-outcome: ${{ steps.scan.outcome }}
          raw-evidence: trivy-deps.sarif
          blocking: ${{ inputs.blocking }}
          coverage-included: '["dependency manifests and lockfiles"]'
          coverage-excluded: '["installed dependency state","build-generated manifests"]'
          coverage-limitations: '["reachability and packages visible only after installation or build are excluded"]'

      - name: Upload normalized dependency Evaluation Result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evaluation-result-trivy-dependencies
          path: ${{ runner.temp }}/trivy-dependencies-evaluation-result.json
          if-no-files-found: error

      - name: Upload Trivy dependency results
        if: always() && hashFiles('trivy-deps.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-deps-results
          path: trivy-deps.sarif

      - name: Upload SARIF to GitHub Security tab
        if: always() && vars.ENABLE_GHAS == 'true' && hashFiles('trivy-deps.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-dependencies
