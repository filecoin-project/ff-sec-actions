# Reusable: manifest and lockfile license evidence (Trivy license scanner).
# This baseline never installs Consumer Project dependencies.
name: License Compliance (reusable)

on:
  workflow_call:
    inputs:
      severity:
        description: License severities to report.
        type: string
        required: false
        default: CRITICAL,HIGH
      blocking:
        description: Fail the evaluation when license findings match the configured severity.
        type: boolean
        required: false
        default: false
      skip-dirs:
        description: Comma-separated dirs Trivy should skip.
        type: string
        required: false
        default: ""

jobs:
  licenses:
    name: License Compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Trivy license scan
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-licenses.sarif
          scanners: license
          severity: ${{ inputs.severity }}
          limit-severities-for-sarif: true
          exit-code: "0"
          cache: "false"
          skip-dirs: ${{ inputs.skip-dirs }}
        continue-on-error: true

      - name: Evaluate license scan outcome
        if: always()
        uses: filecoin-project/ff-sec-actions/actions/evaluation-adapter@a6f4590b2f92d960abfa8edfd64a4787abc9821d
        with:
          evaluation-id: trivy-licenses
          tool-name: trivy
          tool-version: 0.70.0
          tool-outcome: ${{ steps.scan.outcome }}
          raw-evidence: trivy-licenses.sarif
          evidence-artifact: trivy-license-results
          remediation-guidance: >-
            Replace the dependency with a policy-compatible alternative, obtain explicit approval,
            or document a narrowly scoped exception with an owner and expiry.
          blocking: ${{ inputs.blocking }}
          coverage-included: '["licenses visible in dependency manifests and lockfiles"]'
          coverage-excluded: '["licenses visible only after installation or a build"]'
          coverage-limitations: '["source-manifest evidence is not a build-complete license inventory"]'

      - name: Upload normalized license Evaluation Result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evaluation-result-trivy-licenses
          path: ${{ runner.temp }}/trivy-licenses-evaluation-result.json
          if-no-files-found: error

      - name: Upload license results
        if: always() && hashFiles('trivy-licenses.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-license-results
          path: trivy-licenses.sarif
