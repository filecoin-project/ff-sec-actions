# Reusable: license compliance scan (Trivy license scanner).
# Ported from fil-one security.yaml (job: licenses). Node install is optional —
# only needed when licenses live in installed node_modules.
name: License Compliance (reusable)

on:
  workflow_call:
    inputs:
      package-manager:
        description: "Install deps before scanning: pnpm | npm | none."
        type: string
        required: false
        default: none
      node-version:
        type: string
        required: false
        default: "24"
      severity:
        description: License severities to report.
        type: string
        required: false
        default: CRITICAL,HIGH
      skip-dirs:
        description: Comma-separated dirs Trivy should skip.
        type: string
        required: false
        default: ""

jobs:
  licenses:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        if: inputs.package-manager == 'pnpm' || inputs.package-manager == 'npm'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        if: inputs.package-manager != 'none'
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      # trivy-action internally uses actions/cache@v4 (Node 20). Monitor:
      # https://github.com/aquasecurity/trivy-action/releases
      - name: Trivy license scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          scanners: license
          severity: ${{ inputs.severity }}
          skip-dirs: ${{ inputs.skip-dirs }}
        continue-on-error: true # Advisory — review output before blocking
