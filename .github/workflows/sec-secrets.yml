# Reusable: secretless Gitleaks CLI scanning.
# Pull requests scan only their commit range; trusted push, schedule, and manual
# events scan full history. No service license or repository secret is used.
name: Secretless Gitleaks Scan (reusable)

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to the repo's .gitleaks.toml (gitleaks defaults are used if absent).
        type: string
        required: false
        default: .gitleaks.toml
      scan-scope:
        description: "auto, pr-diff, or full-history. Auto selects pr-diff on pull_request."
        type: string
        required: false
        default: auto

jobs:
  secrets:
    name: Secretless Gitleaks Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # Full history for git log scanning

      - name: Run secretless Gitleaks CLI
        id: scan
        uses: filecoin-project/ff-sec-actions/actions/gitleaks-scan@0548d1a4f26c20a6dd62d9793420a8c54b8596f6
        with:
          scan-scope: ${{ inputs.scan-scope }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          config-path: ${{ inputs.config-path }}
          result-file: gitleaks-results.sarif

      - name: Evaluate Gitleaks outcome
        if: always()
        uses: filecoin-project/ff-sec-actions/actions/evaluation-adapter@650fdf6412ff2e3e19ac8f4f124a3257f81c19d9
        with:
          evaluation-id: gitleaks
          tool-name: gitleaks
          tool-version: 8.30.1
          tool-outcome: ${{ steps.scan.outputs.scanner-outcome || 'failure' }}
          raw-evidence: gitleaks-results.sarif
          blocking: true
          coverage-included: '["pull-request commit range or full Git history"]'
          coverage-excluded: '[]'
          coverage-limitations: '["pull requests evaluate only commits introduced by the pull request"]'

      - name: Upload normalized Gitleaks Evaluation Result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evaluation-result-gitleaks
          path: ${{ runner.temp }}/gitleaks-evaluation-result.json
          if-no-files-found: error

      - name: Upload Gitleaks results
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif
          retention-days: 14
