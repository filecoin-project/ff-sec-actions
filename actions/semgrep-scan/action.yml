name: Ecosystem baseline Semgrep scan
description: Run digest-pinned Semgrep with repository-owned conservative rules without executing project code.

inputs:
  target:
    description: Source tree to inspect.
    required: false
    default: .
  config:
    description: Rules file; empty selects the versioned Ecosystem Baseline rules.
    required: false
    default: ""
  result-file:
    description: SARIF destination.
    required: false
    default: semgrep-baseline.sarif
  baseline-ref:
    description: >-
      Optional full commit SHA (usually the pull-request base). When set, each finding
      is marked new or unchanged with SARIF baselineState. Requires that commit in the
      checkout's history.
    required: false
    default: ""

outputs:
  scanner-outcome:
    description: success when Semgrep produced SARIF; failure for operational errors.
    value: ${{ steps.scan.outputs.scanner_outcome }}
  result-file:
    description: SARIF path.
    value: ${{ steps.scan.outputs.result_file }}
  classification:
    description: classified, unavailable (baseline requested but not computed), or not-requested.
    value: ${{ steps.scan.outputs.classification }}

runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        SCAN_TARGET: ${{ inputs.target }}
        SEMGREP_CONFIG: ${{ inputs.config }}
        RESULT_FILE: ${{ inputs.result-file }}
        BASELINE_REF: ${{ inputs.baseline-ref }}
      run: bash "${GITHUB_ACTION_PATH}/semgrep-scan.sh"
