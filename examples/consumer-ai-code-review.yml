# Pilot example: AI review on pull requests.
#
# This uses a reviewed immutable commit of the composite action because no v1
# release exists and the current reusable AI workflow has an unresolved
# transitive release reference. Replace this SHA only after reviewing a newer
# release. No checkout is needed: the action reads the PR diff through the API.
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review pull-request diff
        id: ai
        uses: filecoin-project/ff-sec-actions/actions/ai-code-review@6c57a546abf8cce8e32599009941bf6019e9a354
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          domain: filecoin
          fail-on-severity: none

      - name: Report review result
        if: always()
        run: |
          echo "findings-count: ${{ steps.ai.outputs.findings-count }}"
          echo "highest-severity: ${{ steps.ai.outputs.highest-severity }}"
