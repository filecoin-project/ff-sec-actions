# Reusable: OpenSSF Scorecard supply-chain posture check.
# Ported from fil-one security.yaml (job: scorecard). Advisory baseline.
name: OpenSSF Scorecard (reusable)

on:
  workflow_call:
    inputs:
      publish-results:
        description: Publish results to the OpenSSF REST API (public repos only).
        type: boolean
        required: false
        default: true

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish-results }}

      - name: Upload Scorecard results
        if: always() && hashFiles('scorecard-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-results
          path: scorecard-results.sarif

      - name: Upload SARIF to GitHub Security tab
        if: always() && vars.ENABLE_GHAS == 'true' && hashFiles('scorecard-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: scorecard-results.sarif
          category: openssf-scorecard
