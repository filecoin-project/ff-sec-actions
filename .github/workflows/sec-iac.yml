# Reusable: IaC misconfiguration scanning (Trivy config mode).
# Ported from fil-one security.yaml (job: iac).
name: Trivy IaC Scan (reusable)

on:
  workflow_call:
    inputs:
      severity:
        description: Trivy severities to report.
        type: string
        required: false
        default: CRITICAL,HIGH,MEDIUM
      skip-dirs:
        description: Comma-separated dirs Trivy should skip.
        type: string
        required: false
        default: node_modules
      blocking:
        description: Fail the job on findings.
        type: boolean
        required: false
        default: false

jobs:
  iac:
    name: Trivy IaC Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Trivy IaC misconfiguration scan
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.70.0
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-iac.sarif
          severity: ${{ inputs.severity }}
          limit-severities-for-sarif: true
          exit-code: "0"
          cache: "false"
          skip-dirs: ${{ inputs.skip-dirs }}
        continue-on-error: true

      - name: Evaluate IaC scan outcome
        if: always()
        uses: filecoin-project/ff-sec-actions/actions/evaluation-adapter@5565507389b1444bfdb6b36d366d17206faf3dc3
        with:
          evaluation-id: trivy-iac
          tool-name: trivy
          tool-version: 0.70.0
          tool-outcome: ${{ steps.scan.outcome }}
          raw-evidence: trivy-iac.sarif
          evidence-artifact: trivy-iac-results
          remediation-guidance: >-
            Apply the least-privilege configuration recommended by the Trivy rule, validate the
            deployed configuration, and document any exception with an owner and expiry.
          blocking: ${{ inputs.blocking }}
          coverage-included: '["infrastructure configuration recognized by Trivy"]'
          coverage-excluded: '["runtime cloud state"]'
          coverage-limitations: '["configuration generated only during a build is excluded"]'

      - name: Upload normalized IaC Evaluation Result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evaluation-result-trivy-iac
          path: ${{ runner.temp }}/trivy-iac-evaluation-result.json
          if-no-files-found: error

      - name: Upload Trivy IaC results
        if: always() && hashFiles('trivy-iac.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-iac-results
          path: trivy-iac.sarif
