# Reusable: source manifest SBOM generation (Anchore/Syft, CycloneDX default).
# Build-enhanced package discovery belongs in a separate privileged analysis.
name: SBOM Generation (reusable)

on:
  workflow_call:
    inputs:
      format:
        description: SBOM format.
        type: string
        required: false
        default: cyclonedx-json
      output-file:
        description: SBOM output file / artifact name.
        type: string
        required: false
        default: sbom-cyclonedx.json

jobs:
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: ${{ inputs.format }}
          output-file: ${{ inputs.output-file }}
          artifact-name: ${{ inputs.output-file }}
