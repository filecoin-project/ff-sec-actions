# Full security pipeline for a CONSUMER repo — one job, all scanners.
# Drop into the consumer repo as .github/workflows/security.yml.
#
# Optional per-repo config files (auto-detected, all can be omitted):
#   .semgrep.yml, .gitleaks.toml, .trivyignore, slither.config.json
# Optional repo/org variable: ENABLE_GHAS='true' uploads SARIF to the Security tab.
# No repository or organization secret is required for the baseline scanners.
#
# Pre-v1 pilot: this reviewed commit selects the complete immutable execution
# graph. Advance it only after reviewing the release diff and graph check.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * 0' # Weekly: Sunday 2am UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    # The reusable workflow's jobs inherit at most these permissions.
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write # dependency-review PR comments
    uses: filecoin-project/ff-sec-actions/.github/workflows/security-pipeline.yml@12c3ea8d24a42b6cf9f335e58e0b21c92db88171
    with:
      # Safe baseline: inspect manifests and lockfiles without running package
      # installation hooks from repository content.
      skip-dirs: node_modules,contracts/lib,.sst
      publish-sarif: ${{ vars.ENABLE_GHAS == 'true' }}
      # GitHub Actions security is enabled by default and reports
      # medium-or-higher Zizmor auditor findings. Keep them advisory for the
      # first run, then set actions-security-blocking: true after triage.
      actions-security-blocking: false
      secrets-blocking: false
      # Finding gates are independent from tool failure; tool failure always
      # fails. Uncomment only after observing the advisory result volume:
      # dependency-blocking: true
      # secrets-blocking: true
      # iac-blocking: true
      # license-blocking: true
      # semgrep-blocking: true
      # dependency-severity: CRITICAL,HIGH
      # iac-severity: CRITICAL,HIGH
      # license-severity: CRITICAL,HIGH
      # Opt-in scanners:
      # enable-scorecard: true          # also grant id-token: write
      # enable-codeql: true            # requires GHAS
      # enable-slither: true           # Solidity/Foundry repos
      # slither-target: contracts
      # slither-fail-on: high
  # À la carte alternative — call individual scanners as separate jobs:
  # semgrep:
  #   uses: filecoin-project/ff-sec-actions/.github/workflows/sec-semgrep.yml@defb8d4171a07bc4e0001c998cb866c96c4d5750
  # secrets-scan:
  #   uses: filecoin-project/ff-sec-actions/.github/workflows/sec-secrets.yml@defb8d4171a07bc4e0001c998cb866c96c4d5750
