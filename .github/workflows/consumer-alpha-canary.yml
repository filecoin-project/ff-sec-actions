name: Consumer Alpha Canary

on:
  push:
    branches:
      - optimization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consumer-alpha-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    permissions:
      actions: read
      contents: read
    uses: filecoin-project/ff-sec-actions/.github/workflows/ecosystem-baseline.yml@49a06a7a54e5b4bfe607d3f32e242f72a7fc152b
    with:
      require-complete: true
      actions-security-blocking: false
      dependency-blocking: false
      iac-blocking: false
      static-analysis-blocking: false
      skip-dirs: node_modules,vendor,target,dist,test/fixtures
